name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/beyond_dev_test?schema=public"
      AUTH_SECRET: "ci-test-secret-not-for-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
      EMAIL_SERVER_HOST: "smtp.example.com"
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: "test@example.com"
      EMAIL_SERVER_PASSWORD: "test-password"
      EMAIL_FROM: "noreply@beyond.dev"
      ADMIN_EMAIL: "admin@beyond.dev"
      ADMIN_PASSWORD: "ci-test-password"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
